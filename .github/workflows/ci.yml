name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # La misma versión que usa la imagen (ubuntu:26.04)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      # Las herramientas que usa el bot y que los tests ejercitan de verdad
      # (conversiones con ffmpeg, RAR con unrar). Sin ellas esos tests se
      # saltan en vez de fallar, así que conviene que estén
      - name: Instalar ffmpeg y unrar
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          sudo apt-get install -y --no-install-recommends unrar || echo "unrar no disponible: sus tests se saltan"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Comprobar sintaxis
        run: python -m compileall -q .

      # Sin --exit-zero: aquí solo se miran los errores reales. Los avisos de
      # "may be undefined" que generaban los import * ya no deberían aparecer
      - name: pyflakes
        run: python -m pyflakes *.py handlers/ services/ utils/ tests/

      - name: Tests
        run: python -m pytest -q -rs

  # El Dockerfile de produccion no copia el codigo local: descarga el zip del tag
  # publicado en GitHub. Por eso solo se puede construir cuando el tag existe, y
  # este job va sobre tags y no sobre cada push a main
  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Construir la imagen
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker build -f Dockerfile --build-arg VERSION="$version" -t dropbot:ci .

      - name: Arrancar sin configuracion debe fallar con un mensaje claro
        run: |
          output=$(docker run --rm dropbot:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "TELEGRAM_TOKEN"

      # Desde la 4.0.0 las variables antiguas solo siembran settings.json: una
      # invalida se ignora con un aviso, y el arranque sigue hasta el token
      - name: Un AUTO_SEND invalido se ignora sin abortar
        run: |
          output=$(docker run --rm -e TELEMETRY=false -e AUTO_SEND=NO_EXISTE dropbot:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "Ignoring AUTO_SEND"
          echo "$output" | grep -q "TELEGRAM_TOKEN"
