# yt-dlp configuration file
# This file is automatically loaded by yt-dlp

# Enable automatic download of EJS (External JS Scripts) from GitHub
# Required for YouTube downloads since yt-dlp needs to solve JavaScript challenges
# See: https://github.com/yt-dlp/yt-dlp/wiki/EJS
--remote-components ejs:github

# Cliente de YouTube usado para la extracción
# El cliente por defecto (android_vr) devuelve HTTP 403 a mitad de descarga en los
# formatos de alta calidad. tv_simply funciona con el PO Token generado por el
# proveedor bgutil que se levanta junto al bot en 127.0.0.1:4416
--extractor-args "youtube:player_client=tv_simply"

